<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Config</title>
  
  <link rel="stylesheet" href="Style/style.css">
  <link rel="stylesheet" href="Style/menu.css">
</head>
<body data-ws="/ws/config">
 <script src="JS/menu.js"></script>
  
  <main class="cont">
    <h1>Configuracion</h1>
    <div class="rejilla">
      <div class="tarjeta"><h2>Contador config</h2><div class="valor" data-v="contador2">-</div></div>
      <div class="tarjeta">
        <h2>Valor de la placa</h2>
        <p>Actual: <b id="valor">-</b></p>
        <div class="fila" style="margin-top:14px">
          <input id="nuevo" type="number" value="0">
          <button class="btn" onclick="enviar()">ENVIAR</button>
        </div>
        <p id="resp" class="dim"></p>
      </div>
    </div>
  </main>

  <script src="JS/vars.js"></script>
  <script>
    async function cargar() {
      const r = await fetch('/api/valor');
      const d = await r.json();
      document.getElementById('valor').textContent = d.valor;
    }
    async function enviar() {
      const v = document.getElementById('nuevo').value;
      const r = await fetch('/api/valor?v=' + v, { method: 'POST' });
      document.getElementById('resp').textContent = await r.text();
      cargar();
    }
    cargar();
  </script>
</body>
</html>
